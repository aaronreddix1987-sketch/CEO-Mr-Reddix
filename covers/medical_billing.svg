<svg xmlns="http://www.w3.org/2000/svg" width="400" height="560" viewBox="0 0 400 560">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9B59B6;stop-opacity:0.15" />
      <stop offset="50%" style="stop-color:#9B59B6;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#9B59B6;stop-opacity:0.15" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="560" fill="url(#bg)"/>
  
  <!-- Top accent bar -->
  <rect x="0" y="0" width="400" height="6" fill="#9B59B6"/>
  
  <!-- Diagonal shine -->
  <polygon points="0,0 200,0 400,560 0,560" fill="url(#shine)" opacity="0.4"/>
  
  <!-- Border -->
  <rect x="12" y="12" width="376" height="536" fill="none" stroke="#9B59B6" stroke-width="1.5" opacity="0.4"/>
  <rect x="16" y="16" width="368" height="528" fill="none" stroke="#9B59B6" stroke-width="0.5" opacity="0.2"/>

  <!-- TTI Brand Bar -->
  <rect x="12" y="12" width="376" height="44" fill="#9B59B6" opacity="0.12"/>
  <text x="200" y="38" font-family="Arial Black, Arial" font-weight="900" font-size="11" fill="#9B59B6" text-anchor="middle" letter-spacing="4">TOTAL TRANSFORMATION INC.</text>

  <!-- Icon -->
  <text x="200" y="165" font-size="72" text-anchor="middle">🏥</text>

  <!-- Title Line 1 -->
  <text x="200" y="230" font-family="Arial Black, Arial" font-weight="900" font-size="24" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">Medical Billing</text>

  <!-- Title Line 2 -->
  <text x="200" y="268" font-family="Arial Black, Arial" font-weight="900" font-size="30" fill="#9B59B6" text-anchor="middle" letter-spacing="1">Mastery</text>

  <!-- Divider -->
  <line x1="60" y1="295" x2="340" y2="295" stroke="#9B59B6" stroke-width="1" opacity="0.5"/>

  <!-- Subtitle -->
  <text x="200" y="325" font-family="Arial, sans-serif" font-size="14" fill="#AAAAAA" text-anchor="middle">6-Figure Career Guide</text>

  <!-- Author section -->
  <rect x="60" y="440" width="280" height="58" rx="4" fill="#9B59B6" opacity="0.12"/>
  <rect x="60" y="440" width="280" height="58" rx="4" fill="none" stroke="#9B59B6" stroke-width="1" opacity="0.3"/>
  <text x="200" y="464" font-family="Arial, sans-serif" font-size="11" fill="#888888" text-anchor="middle" letter-spacing="2">BY</text>
  <text x="200" y="486" font-family="Arial Black, Arial" font-weight="900" font-size="16" fill="#9B59B6" text-anchor="middle">AARON T. REDDIX</text>

  <!-- Bottom bar -->
  <rect x="0" y="530" width="400" height="30" fill="#9B59B6" opacity="0.1"/>
  <text x="200" y="550" font-family="Arial, sans-serif" font-size="10" fill="#9B59B6" text-anchor="middle" opacity="0.7">totaltransformationinc.com</text>
  
  <!-- Bottom accent -->
  <rect x="0" y="554" width="400" height="6" fill="#9B59B6"/>
</svg>