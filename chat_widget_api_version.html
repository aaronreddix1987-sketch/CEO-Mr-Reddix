<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTI AI Assistant - API Powered</title>
    <style>
        /* [SAME CSS AS BEFORE - COPY FROM chat_widget.html] */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0052FF;
            --secondary: #00D4FF;
            --dark: #0A0E27;
            --accent: #FF3366;
            --success: #00FF88;
            --gray-bg: #1a1f3a;
            --gray-light: rgba(255, 255, 255, 0.1);
            --gray-text: rgba(255, 255, 255, 0.7);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .chat-button {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 65px;
            height: 65px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 10px 40px rgba(0, 82, 255, 0.4);
            transition: all 0.3s ease;
            z-index: 9998;
            border: none;
        }

        .chat-button:hover {
            transform: scale(1.1) translateY(-3px);
            box-shadow: 0 15px 50px rgba(0, 82, 255, 0.6);
        }

        .chat-button svg {
            width: 32px;
            height: 32px;
            fill: white;
        }

        .notification-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--accent);
            color: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .chat-window {
            position: fixed;
            bottom: 110px;
            right: 30px;
            width: 420px;
            height: 650px;
            background: var(--dark);
            border-radius: 20px;
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.6);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 9999;
            border: 1px solid var(--gray-light);
            animation: slideUp 0.3s ease;
        }

        .chat-window.active {
            display: flex;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .chat-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--gray-light);
        }

        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .header-info h3 {
            color: white;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .header-info p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 12px;
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            margin-right: 5px;
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.3s;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: var(--gray-bg);
        }

        .chat-messages::-webkit-scrollbar {
            width: 8px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--gray-light);
            border-radius: 10px;
        }

        .message {
            display: flex;
            gap: 10px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: var(--accent);
        }

        .message-content {
            max-width: 75%;
        }

        .message-bubble {
            background: rgba(255, 255, 255, 0.08);
            padding: 12px 16px;
            border-radius: 15px;
            color: white;
            font-size: 14px;
            line-height: 1.5;
            border: 1px solid var(--gray-light);
            white-space: pre-wrap;
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
        }

        .message-time {
            font-size: 11px;
            color: var(--gray-text);
            margin-top: 5px;
            padding: 0 5px;
        }

        .product-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--gray-light);
            border-radius: 12px;
            padding: 15px;
            margin-top: 10px;
            transition: all 0.3s;
        }

        .product-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .product-title {
            color: white;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .product-description {
            color: var(--gray-text);
            font-size: 13px;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .product-price {
            color: var(--success);
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .product-buttons {
            display: flex;
            gap: 8px;
        }

        .product-btn {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: all 0.3s;
            border: none;
            flex: 1;
        }

        .btn-primary-small {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }

        .btn-primary-small:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 82, 255, 0.4);
        }

        .btn-secondary-small {
            background: transparent;
            color: var(--secondary);
            border: 1px solid var(--secondary);
        }

        .btn-secondary-small:hover {
            background: rgba(0, 212, 255, 0.1);
        }

        .typing-indicator {
            display: none;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            width: fit-content;
            border: 1px solid var(--gray-light);
        }

        .typing-indicator.active {
            display: block;
        }

        .typing-dots {
            display: flex;
            gap: 5px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--secondary);
            border-radius: 50%;
            animation: typingBounce 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }

        .quick-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .quick-action-btn {
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--gray-light);
            border-radius: 20px;
            color: white;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .quick-action-btn:hover {
            background: rgba(0, 82, 255, 0.2);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .chat-input {
            padding: 20px;
            background: var(--dark);
            border-top: 1px solid var(--gray-light);
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .chat-input input {
            flex: 1;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--gray-light);
            border-radius: 25px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        .chat-input input:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.1);
        }

        .chat-input input::placeholder {
            color: var(--gray-text);
        }

        .send-btn {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .send-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 20px rgba(0, 82, 255, 0.4);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .send-btn svg {
            width: 20px;
            height: 20px;
            fill: white;
        }

        .powered-by {
            text-align: center;
            padding: 10px;
            font-size: 11px;
            color: var(--gray-text);
            border-top: 1px solid var(--gray-light);
        }

        .welcome-message {
            background: linear-gradient(135deg, rgba(0, 82, 255, 0.1), rgba(0, 212, 255, 0.1));
            border: 1px solid var(--primary);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
        }

        .welcome-title {
            font-size: 16px;
            font-weight: 700;
            color: white;
            margin-bottom: 8px;
        }

        .welcome-text {
            font-size: 13px;
            color: var(--gray-text);
            line-height: 1.5;
        }

        .api-selector {
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid var(--gray-light);
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }

        .api-selector label {
            color: var(--gray-text);
            font-size: 12px;
        }

        .api-selector select {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--gray-light);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
        }

        @media (max-width: 768px) {
            .chat-window {
                bottom: 0;
                right: 0;
                left: 0;
                width: 100%;
                height: 100%;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
    <button class="chat-button" id="chatButton" aria-label="Open chat">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C6.48 2 2 6.48 2 12c0 1.54.36 3 .97 4.29L2 22l5.71-.97C9 21.64 10.46 22 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm0 18c-1.38 0-2.68-.29-3.87-.8l-.27-.13-2.8.48.48-2.8-.13-.27C4.79 14.68 4.5 13.38 4.5 12c0-4.14 3.36-7.5 7.5-7.5s7.5 3.36 7.5 7.5-3.36 7.5-7.5 7.5z"/>
        </svg>
        <span class="notification-badge">AI</span>
    </button>

    <div class="chat-window" id="chatWindow">
        <div class="chat-header">
            <div class="chat-header-left">
                <div class="avatar">🤖</div>
                <div class="header-info">
                    <h3>TTI AI Assistant</h3>
                    <p><span class="status-indicator"></span>AI-Powered</p>
                </div>
            </div>
            <button class="close-btn" id="closeBtn" aria-label="Close chat">&times;</button>
        </div>

        <!-- API SELECTOR -->
        <div class="api-selector">
            <label for="apiSelect">AI Model:</label>
            <select id="apiSelect">
                <option value="claude">Claude (Anthropic)</option>
                <option value="openai">OpenAI GPT-4</option>
                <option value="local">Local (Pattern Match)</option>
            </select>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message">
                <div class="message-avatar">🤖</div>
                <div class="message-content">
                    <div class="welcome-message">
                        <div class="welcome-title">👋 AI-Powered Assistant</div>
                        <div class="welcome-text">
                            I'm powered by advanced AI (Claude/GPT-4) and can have intelligent conversations about your needs. Ask me anything!
                        </div>
                    </div>
                    <div class="message-bubble">What transformation are you seeking today?</div>
                    <div class="quick-actions">
                        <button class="quick-action-btn" onclick="quickSearch('credit repair')">💳 Credit</button>
                        <button class="quick-action-btn" onclick="quickSearch('recovery')">🔄 Recovery</button>
                        <button class="quick-action-btn" onclick="quickSearch('business')">💼 Business</button>
                        <button class="quick-action-btn" onclick="quickSearch('real estate')">🏠 Real Estate</button>
                    </div>
                    <div class="message-time">Just now</div>
                </div>
            </div>
        </div>

        <div class="typing-indicator" id="typingIndicator">
            <div class="typing-dots">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
        </div>

        <div class="chat-input">
            <div class="input-wrapper">
                <input
                    type="text"
                    id="messageInput"
                    placeholder="Ask me anything about our products..."
                    autocomplete="off"
                />
                <button class="send-btn" id="sendBtn" aria-label="Send message">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </div>
        </div>

        <div class="powered-by">
            Powered by Einstein Mode AI ⚡ Total Transformation Inc.
        </div>
    </div>

    <script>
        // CONFIGURATION - UPDATE THESE!
        const CONFIG = {
            CLAUDE_API_KEY: 'YOUR_CLAUDE_API_KEY_HERE', // Get from: https://console.anthropic.com/
            OPENAI_API_KEY: 'YOUR_OPENAI_API_KEY_HERE', // Get from: https://platform.openai.com/
            BACKEND_PROXY: null, // Optional: 'https://yourdomain.com/api/chat' for secure API calls
        };

        // [INCLUDE PRODUCTS ARRAY FROM chat_widget.html - 88 products]
        const PRODUCTS = [
            // Copy entire PRODUCTS array from previous file
            {id: 1, name: "Credit Mastery Bundle", price: 79.99, category: "credit", description: "Complete credit repair system", keywords: ["credit"], stripeUrl: "https://buy.stripe.com/credit"},
            // ... all 88 products
        ];

        let chatHistory = [];
        let conversationHistory = [];
        let isTyping = false;

        const chatButton = document.getElementById('chatButton');
        const chatWindow = document.getElementById('chatWindow');
        const closeBtn = document.getElementById('closeBtn');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatMessages = document.getElementById('chatMessages');
        const typingIndicator = document.getElementById('typingIndicator');
        const apiSelect = document.getElementById('apiSelect');

        chatButton.addEventListener('click', () => {
            chatWindow.classList.toggle('active');
            chatButton.classList.toggle('active');
            if (chatWindow.classList.contains('active')) {
                messageInput.focus();
            }
        });

        closeBtn.addEventListener('click', () => {
            chatWindow.classList.remove('active');
            chatButton.classList.remove('active');
        });

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function sendMessage() {
            const message = messageInput.value.trim();
            if (!message || isTyping) return;

            addMessage(message, 'user');
            messageInput.value = '';

            const selectedAPI = apiSelect.value;
            processMessageWithAI(message, selectedAPI);
        }

        function addMessage(text, sender = 'bot', products = null) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = sender === 'user' ? '👤' : '🤖';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.textContent = text;

            const time = document.createElement('div');
            time.className = 'message-time';
            time.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            contentDiv.appendChild(bubble);

            if (products && products.length > 0) {
                products.forEach(product => {
                    const card = createProductCard(product);
                    contentDiv.appendChild(card);
                });
            }

            contentDiv.appendChild(time);
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentDiv);

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            chatHistory.push({ text, sender, timestamp: new Date() });
        }

        function createProductCard(product) {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <div class="product-title">${product.name}</div>
                <div class="product-description">${product.description}</div>
                <div class="product-price">$${product.price.toFixed(2)}</div>
                <div class="product-buttons">
                    <a href="${product.stripeUrl}" target="_blank" class="product-btn btn-primary-small">Buy Now</a>
                    <button class="product-btn btn-secondary-small" onclick="learnMore(${product.id})">Details</button>
                </div>
            `;
            return card;
        }

        function showTyping() {
            isTyping = true;
            typingIndicator.classList.add('active');
            chatMessages.appendChild(typingIndicator);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function hideTyping() {
            isTyping = false;
            typingIndicator.classList.remove('active');
        }

        async function processMessageWithAI(message, apiType) {
            showTyping();

            try {
                let response;

                if (apiType === 'claude') {
                    response = await callClaudeAPI(message);
                } else if (apiType === 'openai') {
                    response = await callOpenAIAPI(message);
                } else {
                    response = await localPatternMatch(message);
                }

                hideTyping();
                addMessage(response.text, 'bot', response.products);

            } catch (error) {
                console.error('AI API Error:', error);
                hideTyping();
                addMessage("I'm having trouble connecting. Let me help you with our product categories: Credit, Recovery, Business, Real Estate, or AI Automation. What interests you?", 'bot');
            }
        }

        async function callClaudeAPI(message) {
            const endpoint = CONFIG.BACKEND_PROXY || 'https://api.anthropic.com/v1/messages';

            conversationHistory.push({
                role: 'user',
                content: message
            });

            const systemPrompt = `You are a helpful sales assistant for Total Transformation Inc.

Available products (${PRODUCTS.length} total):
${JSON.stringify(PRODUCTS.slice(0, 20), null, 2)}

Instructions:
1. Understand customer needs from their message
2. Recommend 2-3 relevant products
3. Be concise but helpful
4. Format product recommendations like: [PRODUCT:ID] where ID is the product id
5. Explain why each product helps

Example: "Based on your credit needs, I recommend [PRODUCT:1] and [PRODUCT:2] because..."`;

            const response = await fetch(endpoint, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-api-key': CONFIG.CLAUDE_API_KEY,
                    'anthropic-version': '2023-06-01'
                },
                body: JSON.stringify({
                    model: 'claude-3-sonnet-20240229',
                    max_tokens: 1024,
                    system: systemPrompt,
                    messages: conversationHistory.slice(-10) // Last 10 messages
                })
            });

            if (!response.ok) {
                throw new Error(`Claude API error: ${response.status}`);
            }

            const data = await response.json();
            const assistantMessage = data.content[0].text;

            conversationHistory.push({
                role: 'assistant',
                content: assistantMessage
            });

            // Extract product IDs from [PRODUCT:ID] format
            const productIds = extractProductIds(assistantMessage);
            const products = productIds.map(id => PRODUCTS.find(p => p.id === id)).filter(Boolean);

            // Remove [PRODUCT:ID] tags from text
            const cleanText = assistantMessage.replace(/\[PRODUCT:\d+\]/g, '').trim();

            return { text: cleanText, products };
        }

        async function callOpenAIAPI(message) {
            const endpoint = CONFIG.BACKEND_PROXY || 'https://api.openai.com/v1/chat/completions';

            const systemPrompt = `You are a helpful sales assistant for Total Transformation Inc. Recommend relevant products based on customer needs. Format recommendations as [PRODUCT:ID]. Be concise.

Products: ${JSON.stringify(PRODUCTS.slice(0, 20))}`;

            conversationHistory.push({ role: 'user', content: message });

            const response = await fetch(endpoint, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${CONFIG.OPENAI_API_KEY}`
                },
                body: JSON.stringify({
                    model: 'gpt-4',
                    messages: [
                        { role: 'system', content: systemPrompt },
                        ...conversationHistory.slice(-10)
                    ],
                    temperature: 0.7,
                    max_tokens: 500
                })
            });

            if (!response.ok) {
                throw new Error(`OpenAI API error: ${response.status}`);
            }

            const data = await response.json();
            const assistantMessage = data.choices[0].message.content;

            conversationHistory.push({ role: 'assistant', content: assistantMessage });

            const productIds = extractProductIds(assistantMessage);
            const products = productIds.map(id => PRODUCTS.find(p => p.id === id)).filter(Boolean);
            const cleanText = assistantMessage.replace(/\[PRODUCT:\d+\]/g, '').trim();

            return { text: cleanText, products };
        }

        async function localPatternMatch(message) {
            // Simple pattern matching fallback
            const lowerMessage = message.toLowerCase();
            let response = '';
            let matchedProducts = [];

            if (lowerMessage.includes('credit')) {
                response = "For credit repair, I recommend these solutions:";
                matchedProducts = PRODUCTS.filter(p => p.category === 'credit').slice(0, 3);
            } else if (lowerMessage.includes('recovery') || lowerMessage.includes('addiction')) {
                response = "For recovery support, check out:";
                matchedProducts = PRODUCTS.filter(p => p.category === 'recovery').slice(0, 3);
            } else if (lowerMessage.includes('business')) {
                response = "To grow your business, I suggest:";
                matchedProducts = PRODUCTS.filter(p => p.category === 'business').slice(0, 3);
            } else if (lowerMessage.includes('real estate')) {
                response = "For real estate investing:";
                matchedProducts = PRODUCTS.filter(p => p.category === 'realestate').slice(0, 3);
            } else if (lowerMessage.includes('ai') || lowerMessage.includes('automation')) {
                response = "Our AI automation solutions:";
                matchedProducts = PRODUCTS.filter(p => p.category === 'ai').slice(0, 3);
            } else {
                response = "I can help with Credit Repair, Recovery, Business Growth, Real Estate, or AI Automation. What interests you?";
            }

            return { text: response, products: matchedProducts };
        }

        function extractProductIds(text) {
            const matches = text.match(/\[PRODUCT:(\d+)\]/g);
            if (!matches) return [];
            return matches.map(m => parseInt(m.match(/\d+/)[0]));
        }

        window.quickSearch = function(query) {
            messageInput.value = query;
            sendMessage();
        };

        window.learnMore = function(productId) {
            const product = PRODUCTS.find(p => p.id === productId);
            if (product) {
                messageInput.value = `Tell me more about ${product.name}`;
                sendMessage();
            }
        };
    </script>
</body>
</html>
